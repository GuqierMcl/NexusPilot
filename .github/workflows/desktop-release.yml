name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_only:
        description: "仅执行发布 job，复用已有 run 的构建 artifacts 发布到 S3 和 GitHub Releases"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "要发布的 tag，例如 v0.10.0"
        required: false
        type: string
      artifact_run_id:
        description: "提供构建 artifacts 的 workflow run ID"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  verify:
    name: Verify release source
    if: github.event_name != 'workflow_dispatch' || inputs.publish_only != true
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check frontend and AI runtime
        run: |
          bun run tsc --noEmit
          bun run ai-runtime:typecheck

      - name: Test CI release publisher
        run: bun test scripts/github-release

  package:
    name: Package ${{ matrix.platform }}
    if: github.event_name != 'workflow_dispatch' || inputs.publish_only != true
    needs: verify
    runs-on: ${{ fromJSON(matrix.runner) }}
    environment: release

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: '["ubuntu-24.04"]'
            bundles: deb,rpm
            artifact_name: nexuspilot-linux-x86_64

          - platform: windows-x86_64
            runner: '["windows-2022"]'
            bundles: nsis
            artifact_name: nexuspilot-windows-x86_64

          - platform: darwin-x86_64
            runner: '["macos-15-intel"]'
            bundles: dmg,app
            artifact_name: nexuspilot-darwin-x86_64

          - platform: darwin-aarch64
            runner: '["macos-14"]'
            bundles: dmg,app
            artifact_name: nexuspilot-darwin-aarch64

    env:
      # 仅在仓库的受保护发布 tag push 中提供；绝不提交私钥文件。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            wget

      - name: Install NSIS when absent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
          }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux DEB and RPM packages
        if: runner.os == 'Linux'
        run: >-
          bun run tauri build --bundles ${{ matrix.bundles }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Sign Linux package updater payloads
        if: runner.os == 'Linux'
        shell: bash
        run: |
          while IFS= read -r -d '' package; do
            bun run tauri signer sign "$package"
          done < <(find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' \) -print0)

      - name: Build Windows installer and updater artifacts
        if: runner.os == 'Windows'
        run: bun run tauri build --bundles ${{ matrix.bundles }}

      - name: Build macOS ad-hoc installer and updater artifacts
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: bun run tauri build --bundles ${{ matrix.bundles }}

      - name: Verify macOS ad-hoc application signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          app_path="src-tauri/target/release/bundle/macos/NexusPilot.app"
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"

          if [[ ! -d "$app_path" ]]; then
            echo "::error::缺少 macOS 应用包：$app_path"
            exit 1
          fi

          if [[ -z "$dmg_path" ]]; then
            echo "::error::缺少 macOS DMG 安装包"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=4 "$app_path"
          signature_info="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          echo "$signature_info"

          if [[ "$signature_info" != *"Signature=adhoc"* ]]; then
            echo "::error::macOS 应用未生成完整的 ad-hoc 签名"
            exit 1
          fi

          hdiutil verify "$dmg_path"

      - name: Upload platform bundle directory
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: src-tauri/target/release/bundle/**

  publish:
    name: Publish to S3 and GitHub Releases
    needs: package
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_only == true) || needs.package.result == 'success')
    runs-on: ubuntu-24.04
    environment: release

    permissions:
      contents: write
      actions: read

    env:
      CI_RELEASE_PUBLIC_BASE_URL: ${{ vars.CI_RELEASE_PUBLIC_BASE_URL }}
      CI_RELEASE_S3_ENDPOINT: ${{ vars.CI_RELEASE_S3_ENDPOINT }}
      CI_RELEASE_S3_REGION: ${{ vars.CI_RELEASE_S3_REGION }}
      CI_RELEASE_S3_BUCKET: ${{ vars.CI_RELEASE_S3_BUCKET }}
      CI_RELEASE_S3_PREFIX: ${{ vars.CI_RELEASE_S3_PREFIX }}
      CI_RELEASE_S3_ACCESS_KEY_ID: ${{ secrets.CI_RELEASE_S3_ACCESS_KEY_ID }}
      CI_RELEASE_S3_SECRET_ACCESS_KEY: ${{ secrets.CI_RELEASE_S3_SECRET_ACCESS_KEY }}
      CI_RELEASE_S3_FORCE_PATH_STYLE: ${{ vars.CI_RELEASE_S3_FORCE_PATH_STYLE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Linux bundle
        uses: actions/download-artifact@v8
        with:
          name: nexuspilot-linux-x86_64
          path: release-input/nexpilot-linux-x86_64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_only == true && inputs.artifact_run_id || github.run_id }}

      - name: Download Windows bundle
        uses: actions/download-artifact@v8
        with:
          name: nexuspilot-windows-x86_64
          path: release-input/nexpilot-windows-x86_64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_only == true && inputs.artifact_run_id || github.run_id }}

      - name: Download macOS Intel bundle
        uses: actions/download-artifact@v8
        with:
          name: nexuspilot-darwin-x86_64
          path: release-input/nexpilot-darwin-x86_64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_only == true && inputs.artifact_run_id || github.run_id }}

      - name: Download macOS Apple Silicon bundle
        uses: actions/download-artifact@v8
        with:
          name: nexuspilot-darwin-aarch64
          path: release-input/nexpilot-darwin-aarch64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_only == true && inputs.artifact_run_id || github.run_id }}

      - name: Inspect downloaded bundle layout
        shell: bash
        run: |
          set -euo pipefail
          pwd
          if [[ -d release-input ]]; then
            find release-input -maxdepth 8 -print | sort
          else
            echo "::error::release-input 目录不存在"
          fi

      - name: Verify native bundle inputs
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            nexpilot-linux-x86_64 \
            nexpilot-windows-x86_64 \
            nexpilot-darwin-x86_64 \
            nexpilot-darwin-aarch64; do
            directory="release-input/${artifact}"
            if [[ ! -d "$directory" ]]; then
              echo "::error::缺少下载的 CI Artifact 目录：$directory"
              exit 1
            fi
            if [[ -z "$(find "$directory" -type f -print -quit)" ]]; then
              echo "::error::CI Artifact 目录为空：$directory"
              exit 1
            fi
          done

      - name: Publish versioned artifacts and current manifests to S3
        run: >-
          bun scripts/github-release/publish.mjs
          --version "${RELEASE_TAG#v}"
          --input release-input
          --output release-output

      - name: Publish GitHub Release mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun scripts/github-release/publish-to-github.mjs
          --tag "${RELEASE_TAG}"
          --input release-output
          --repository "${GITHUB_REPOSITORY}"
